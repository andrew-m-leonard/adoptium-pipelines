# Stage constants for ci-adoptium-pipelines.
#
# This file is read by the pipeline infrastructure and its values are injected
# as environment variables into every stage script (bash, Python, Groovy).
#
# Bash stage scripts may also source this file directly via load-stage-constants.sh:
#   source "${PIPELINE_LIB}/load-stage-constants.sh"
#
# Vendors may override or extend constants by placing a vendor-constants.properties
# file under vendor-scripts/ in their config repo.  Vendor values win over defaults.
#
# Format: KEY=VALUE (no spaces around =, no quotes needed for simple strings,
#         blank lines and lines beginning with # are ignored)

# Relative sub-folder name under TARGET_DIR where 02-build.sh writes its binary
# outputs, and where downstream stages expect to find JDK artifacts.
BUILD_OUTPUT_DIR=build_output
